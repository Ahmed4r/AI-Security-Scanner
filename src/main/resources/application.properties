spring.application.name=AI-Security-Scanner
server.port=8080
# ollama Connection
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:4b-instruct}
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b
# PostgreSQL Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sentinelai}
spring.datasource.username=${DB_USER:sentinelai}
spring.datasource.password=${DB_PASSWORD:sentinelai_dev}
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true