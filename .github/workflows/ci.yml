
name: SentinelAI CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sentinelai
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sentinelai -d sentinelai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw --batch-mode verify
        env:
          DB_URL: jdbc:postgresql://localhost:5433/sentinelai
          DB_USER: sentinelai
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: qwen3:4b-instruct
